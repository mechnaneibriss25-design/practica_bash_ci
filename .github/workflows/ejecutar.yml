name: Ejucutar Bash

on: 
  push:
    branshes: [main]

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Dar permisos 
        run: chmod +x src/saludo.sh
        
      - name: crear carpeta backup
        run: mkdir -p backup
        
      - name: crear zip comprimido
        run: zip -r backup/backup_datos.zip datos
        
       - name: subir artefacto
         uses: actions/upload-artifact@v4
         with: 
           name: backup-datos
           path: backup/backup_datos.zip
               
      - name: Ejecutar script
        run: ./src/saludo.sh
        
      - name: Mostrar fecha
        run: date
        
      - name: Mostrar mensaje
        run: echo "Comenzando la ejecución"