name: Ejucutar Bash

on: 
  push:
    branshes: [main]

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Dar permisos 
        run: chmod +x src/saludo.sh
        
      - name: Ejecutar script
        run: ./src/saludo.sh
        
      - name: Mostrar fecha
        run: date
        
      - name: Mostrar mensaje
        run: echo "Comenzando la ejecución"